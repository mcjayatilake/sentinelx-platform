name: sentinelx

x-backend-env: &backend-env
  env_file:
    - path: .env
      required: false

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: dev

services:
  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelx} -d ${POSTGRES_DB:-sentinelx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  minio:
    image: minio/minio:latest
    container_name: sentinelx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sentinelx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  backend:
    build: *backend-build
    container_name: sentinelx-backend
    restart: unless-stopped
    <<: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sentinelx-net

  worker:
    build: *backend-build
    container_name: sentinelx-worker
    restart: unless-stopped
    <<: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelx-net

  beat:
    build: *backend-build
    container_name: sentinelx-beat
    restart: unless-stopped
    <<: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelx-net

  flower:
    build: *backend-build
    container_name: sentinelx-flower
    restart: unless-stopped
    <<: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    networks:
      - sentinelx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SentinelX}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sentinelx-net

networks:
  sentinelx-net:
    name: sentinelx-net
    driver: bridge

volumes:
  postgres_data:
    name: sentinelx-postgres-data
  redis_data:
    name: sentinelx-redis-data
  minio_data:
    name: sentinelx-minio-data
