apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelx
  labels:
    app.kubernetes.io/part-of: sentinelx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sentinelx.io
        - api.sentinelx.io
      secretName: sentinelx-tls
  rules:
    - host: api.sentinelx.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
    - host: sentinelx.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
