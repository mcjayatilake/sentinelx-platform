name: Infra CI

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "infrastructure/kubernetes/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "infrastructure/kubernetes/**"
      - ".github/workflows/infra-ci.yml"

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validate:
    name: Validate docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config --quiet

  docker-build:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: sentinelx-${{ matrix.service }}:ci

  kustomize-build:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4
      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Build ${{ matrix.overlay }} overlay
        run: kustomize build infrastructure/kubernetes/overlays/${{ matrix.overlay }}
