apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelx-config
  labels:
    app.kubernetes.io/part-of: sentinelx
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  PROJECT_NAME: "SentinelX"
  API_V1_PREFIX: "/api/v1"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  JWT_ISSUER: "sentinelx.io"
  S3_REGION: "us-east-1"
  S3_BUCKET_NAME: "sentinelx-artifacts"
  S3_USE_SSL: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  NEXT_PUBLIC_API_BASE_URL: "https://api.sentinelx.io/api/v1"
  NEXT_PUBLIC_APP_ENV: "production"
  NEXT_PUBLIC_APP_NAME: "SentinelX"
